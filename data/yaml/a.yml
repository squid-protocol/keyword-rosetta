# keyword rosetta control shell: yaml / a
# decoy: config reads stay in prose only
on:
  workflow_dispatch:
    inputs:
      probe_globals:
        required: false
      probe_test:
        required: false
      probe_safety:
        required: false
permissions:
  contents: read
jobs:
  chain:
    uses: ./b.yml
    steps:
      - run: ': ${{ github.actor }} $HOME'
      - run: |
          pytest
          pytest
      - run: ':'
    continue-on-error: false
