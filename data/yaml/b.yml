# keyword rosetta control shell: yaml / b
# decoy: nothing risky lives here in prose
on:
  workflow_dispatch:
    inputs:
      probe_bypass:
        required: false
      probe_telemetry:
        required: false
      probe_state:
        required: false
jobs:
  chain:
    uses: ./c.yml
    continue-on-error: true
    steps:
      - run: 'echo ::debug::probe'
      - run: 'echo ::warning::probe'
      - run: 'chmod 777 /tmp/probe'
        env:
          COUNTER: 2
    env:
      COUNTER: 1
      NOTE: go
