name: verify-languages

# The gate enforces itself: any PR touching a language folder (or the tools that
# judge them) re-runs verify_language.py for the affected languages against a
# fresh GitGalaxy checkout. A generated language folder that passes is correct
# by construction; one that fails is a bad generation or a real engine change —
# either way it must not merge silently (docs/GATING.md).
#
# The engine is always checked out at its `main` (gitgalaxy#2682 retired the
# committed ENGINE_REF file and the pin on the other side). A corpus PR that
# re-blesses after an engine change therefore opens AFTER that engine PR merges,
# and is green by construction. To verify against an unmerged engine PR in CI --
# the rare case -- dispatch this workflow with `engine_ref=pull/<N>/head`; it is
# a run parameter, so there is nothing committed to reset afterwards.

on:
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - "SPEC.md"
      - ".github/workflows/verify.yml"
      # A ledger/baseline-only PR must still run na_check (it exists to stop a
      # ledger edit reintroducing an unreviewed absence) -- same gap shape as
      # the ENGINE_REF line above (keyword-rosetta#14's lesson).
      - "deviation_ledger.json"
      - "docs/na_baseline.json"
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "gitgalaxy ref to verify against (main, a branch, or pull/<N>/head)"
        required: false
        default: "main"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve engine ref
        id: engineref
        run: |
          ref="${{ github.event.inputs.engine_ref || 'main' }}"
          case "$ref" in pull/*) ref="refs/$ref";; esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "engine ref: $ref"

      - uses: actions/checkout@v4
        with:
          repository: squid-protocol/gitgalaxy
          ref: ${{ steps.engineref.outputs.ref }}
          path: gitgalaxy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Full-precision deps first: without all six, galaxyscope silently drops
      # into Zero-Dependency Mode and the recorded counts can drift from the
      # full-precision numbers the manifests were locked against.
      - name: Install GitGalaxy (full precision)
        run: |
          pip install networkx tiktoken numpy pandas xgboost pyyaml
          pip install -e ./gitgalaxy

      - name: Detect changed languages
        id: langs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            langs=$(ls data)
          else
            langs=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- data/ | cut -d/ -f2 | sort -u)
            # tools/SPEC/workflow changes without data changes: re-verify everything
            if [ -z "$langs" ]; then langs=$(ls data); fi
          fi
          echo "langs=$(echo $langs | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "verifying: $langs"

      # A run that verified nothing must not pass (gitgalaxy#2682): the loop
      # counts what it actually ran, and a verifier that crashed instead of
      # printing PASS/FAIL is a failure too, not a skipped language.
      - name: Run gates
        env:
          GITGALAXY_PATH: ${{ github.workspace }}/gitgalaxy
        run: |
          set -o pipefail
          rc=0; checked=0; failed=""
          for L in ${{ steps.langs.outputs.langs }}; do
            checked=$((checked + 1))
            if ! python tools/verify_language.py "$L" | tee "/tmp/verify_$L.log"; then rc=1; failed="$failed $L"; fi
            if ! grep -qE "^(PASS|FAIL) $L" "/tmp/verify_$L.log"; then
              echo "::error::$L: verify_language.py exited without reporting PASS or FAIL -- infrastructure failure, not corpus drift"
              rc=2
            fi
          done
          total=$(ls data | wc -l)
          echo "verified $checked of $total language folders${failed:+; failed:$failed}"
          if [ "$checked" -eq 0 ]; then
            echo "::error::0 languages verified -- the gate did not run"
            exit 2
          fi
          exit $rc

      # Baseline-gated: fails only on unreviewed rule-absent (n/a) cells beyond
      # docs/na_baseline.json -- a corpus PR cannot quietly create an absence
      # nobody has ledgered. Seconds, no scans.
      - name: n/a review audit
        env:
          GITGALAXY_PATH: ${{ github.workspace }}/gitgalaxy
        run: python tools/na_check.py --ci

      # The committed bias report must have been generated against a FULL-PRECISION
      # engine. In Zero-Dependency Mode the recorder nulls every network metric, so
      # pagerank and the four other topology measures vanish from the comparison with
      # no error -- two reports then differ by five whole columns for reasons nothing
      # in them explains (that is exactly how the pre-#30 report came to have pagerank
      # NULL in all 46 languages). bias_report.py refuses to write in that mode, and
      # this gate catches a cache generated before it did, or with the override.
      # Seconds, no scans: the mode is recorded in the cache the report ships with.
      - name: bias report engine mode
        run: |
          mode=$(python -c "import json;print(json.load(open('docs/bias_data.json')).get('engine_mode','<missing>'))")
          echo "docs/bias_data.json engine_mode: $mode"
          if [ "$mode" != "full-precision" ]; then
            echo "::error::bias_data.json was generated in '$mode', not full-precision."
            echo "Regenerate with GALAXYSCOPE_BIN pointed at the full-precision venv:"
            echo "  GALAXYSCOPE_BIN=<gitgalaxy>/.crucible_venvs/full_precision/bin/galaxyscope python tools/bias_report.py"
            exit 1
          fi
